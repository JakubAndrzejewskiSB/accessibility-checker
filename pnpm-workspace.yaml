# Temporary, until @storyblok/accessibility-checker publishes a version that requires
# @storyblok/region-helper ^1.6.0. Version 0.1.0 declares ^1.5.0, but needs `isEditorOrigin`
# from 1.6.0.
overrides:
  "@storyblok/region-helper": ^1.6.0

# Both versions were published less than a day ago, and pnpm skips such versions by default.
minimumReleaseAgeExclude:
  - "@storyblok/accessibility-checker@0.1.0"
  - "@storyblok/region-helper@1.6.0"

# esbuild (via Vite) ships a postinstall script; pnpm fails the install unless it is allowed.
allowBuilds:
  esbuild: true
